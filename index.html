<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCT 数据采集 - 优化版</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* 橙色大框 (70x20) */
        .guide-box-big {
            position: absolute; 
            top: 40%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 20vh;   
            height: 70vh;  
            border: 3px dashed #ff8c00; 
            border-radius: 8px;
            box-sizing: border-box;
        }
        
        /* 绿色窗格 (放大了2mm边距版本) */
        .guide-box-window {
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%);
            top: 31.43%;    /* 物理 22mm 处 */
            height: 28.57%; /* 物理 20mm 高 */
            width: 30%;     /* 物理 6mm 宽 */
            border: 2px solid #00ff00; 
            background: rgba(0, 255, 0, 0.15);
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }

        #controls {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 15px; box-sizing: border-box; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; gap: 10px; pointer-events: auto;
            border-top: 1px solid #444;
        }
        
        .input-group { display: flex; gap: 8px; }
        input { 
            flex: 1; padding: 12px; border: none; border-radius: 6px; 
            background: #2a2a2a; color: #fff; font-size: 15px; 
            box-sizing: border-box; outline: none;
        }
        input:focus { background: #333; border: 1px solid #007bff; }

        .btn-group { display: flex; gap: 10px; }
        button { 
            flex: 1; padding: 14px; border: none; border-radius: 6px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        #snap-btn { background: #28a745; color: white; }
        #snap-btn:active { background: #218838; }
        #torch-btn { background: #495057; color: white; }

        #status-bar {
            position: absolute; top: 15px; width: 100%; text-align: center;
            font-size: 13px; background: rgba(0,0,0,0.5); padding: 5px 0;
        }
        .low-light { color: #ffbb33; font-weight: bold; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="overlay">
            <div class="guide-box-big">
                <div class="guide-box-window"></div>
            </div>
        </div>
        <div id="status-bar">初始化摄像头...</div>
        
        <div id="controls">
            <div class="input-group">
                <input type="text" id="sample-id" placeholder="样号 (如:G01)">
            </div>
            <div class="input-group">
                <input type="number" id="conc-1" placeholder="指标1浓度">
                <input type="number" id="conc-2" placeholder="指标2浓度">
            </div>

            <div class="btn-group">
                <button id="torch-btn">补光灯</button>
                <button id="snap-btn">确认拍摄并下载</button>
            </div>
        </div>
    </div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusBar = document.getElementById('status-bar');
    const torchBtn = document.getElementById('torch-btn');
    const snapBtn = document.getElementById('snap-btn');
    
    let videoTrack = null;
    let torchOn = false;

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', focusMode: 'continuous' }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
        } catch (err) {
            statusBar.innerHTML = "摄像头访问失败";
        }
    }

    function monitorLight() {
        const ctx = canvas.getContext('2d');
        canvas.width = 64; canvas.height = 64;
        setInterval(() => {
            if (!videoTrack) return;
            ctx.drawImage(video, 0, 0, 64, 64);
            const data = ctx.getImageData(0, 0, 64, 64).data;
            let b = 0;
            for (let i = 0; i < data.length; i += 4) b += (data[i] + data[i+1] + data[i+2]) / 3;
            b /= 4096;
            statusBar.innerHTML = b < 60 ? 
                `<span class="low-light">⚠️ 光线不足 (${Math.round(b)})</span>` : 
                `光照良好 (${Math.round(b)})`;
        }, 800);
    }

    torchBtn.onclick = async () => {
        if (!videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.style.background = torchOn ? "#ffc107" : "#495057";
        } catch (e) { alert("设备不支持闪光灯控制"); }
    };

    snapBtn.onclick = () => {
        const sid = document.getElementById('sample-id').value || "NA";
        const c1 = document.getElementById('conc-1').value || "0";
        const c2 = document.getElementById('conc-2').value || "0";
        const now = new Date();
        const time = now.toISOString().replace(/[:T]/g, '-').slice(0, 16);

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        
        const link = document.createElement('a');
        link.download = `${sid}_C1-${c1}_C2-${c2}_${time}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    };

    initCamera();
    monitorLight();
</script>
</body>
</html>
